<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هزار ستاره سبز | بلو به‌زودی</title>
    <style>
        /* تنظیمات کلی */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: radial-gradient(circle at center, #0a0f1a, #030507);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Tahoma', system-ui, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* بوم ستاره‌ها */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none; /* کلیک از طریق آن عبور کند */
        }

        /* کادر شیشه‌ای (Glassmorphism) */
        .glass-card {
            position: relative;
            z-index: 10;
            background: rgba(0, 255, 180, 0.08);
            backdrop-filter: blur(10px) saturate(180%);
            -webkit-backdrop-filter: blur(10px) saturate(180%);
            border-radius: 48px;
            padding: 2.8rem 4.5rem;
            border: 1px solid rgba(0, 255, 200, 0.25);
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(0, 255, 180, 0.1) inset;
            text-align: center;
            transition: all 0.3s ease;
            animation: floatGlow 4s ease-in-out infinite alternate;
        }

        .glass-card:hover {
            background: rgba(0, 255, 180, 0.12);
            border-color: rgba(0, 255, 200, 0.5);
            box-shadow: 0 30px 60px -10px rgba(0, 200, 150, 0.3), 0 0 0 2px rgba(0, 255, 180, 0.2) inset;
        }

        /* متن اصلی "بلو" */
        .glass-card h1 {
            font-size: 6rem;
            font-weight: 800;
            letter-spacing: 6px;
            color: #b3ffe6;
            text-shadow: 0 0 20px rgba(0, 255, 200, 0.5), 0 0 60px rgba(0, 200, 150, 0.3);
            margin-bottom: 0.25rem;
            line-height: 1.2;
        }

        /* زیرنویس "به‌زودی..." */
        .glass-card .sub {
            font-size: 1.6rem;
            font-weight: 300;
            letter-spacing: 4px;
            color: rgba(180, 255, 220, 0.8);
            text-shadow: 0 0 12px rgba(0, 255, 180, 0.3);
            border-top: 1px solid rgba(0, 255, 200, 0.2);
            padding-top: 0.8rem;
            display: inline-block;
        }

        /* انیمیشن ملایم برای کادر */
        @keyframes floatGlow {
            0% {
                transform: translateY(-6px) scale(1);
                box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(0, 255, 180, 0.15) inset;
            }
            100% {
                transform: translateY(6px) scale(1.01);
                box-shadow: 0 35px 70px -8px rgba(0, 180, 140, 0.4), 0 0 0 2px rgba(0, 255, 200, 0.25) inset;
            }
        }

        /* پاسخگو برای موبایل */
        @media (max-width: 600px) {
            .glass-card {
                padding: 2rem 2.2rem;
                border-radius: 32px;
            }
            .glass-card h1 {
                font-size: 3.8rem;
                letter-spacing: 3px;
            }
            .glass-card .sub {
                font-size: 1.2rem;
                letter-spacing: 2px;
            }
        }

        /* انیمیشن برای ستاره‌ها (توسط JS مدیریت میشه) */
    </style>
</head>
<body>

    <!-- بوم SVG برای ستاره‌ها (هزار ستاره سبز متحرک) -->
    <svg id="starfield" xmlns="http://www.w3.org/2000/svg"></svg>

    <!-- کادر شیشه‌ای با متن بلو و به‌زودی -->
    <div class="glass-card">
        <h1>بلو</h1>
        <div class="sub">پرداخت مستقیم مایکت</div>
        <a class="pay-btn" href="pay.html">شروع خرید</a>
    </div>

    <script>
        (function() {
            const svg = document.getElementById('starfield');
            const COUNT = 1000;       // تعداد ستاره‌ها
            const W = window.innerWidth;
            const H = window.innerHeight;

            // تنظیم ابعاد SVG
            svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
            svg.setAttribute('width', W);
            svg.setAttribute('height', H);

            // ایجاد fragment برای سرعت بیشتر
            const fragment = document.createDocumentFragment();

            // ذخیره‌ی اطلاعات ستاره‌ها برای انیمیشن (موقعیت، اندازه، سرعت)
            const stars = [];

            for (let i = 0; i < COUNT; i++) {
                // موقعیت تصادفی
                const cx = Math.random() * W;
                const cy = Math.random() * H;
                // اندازه‌ی تصادفی بین 1.5 تا 4.5 پیکسل (برای تنوع)
                const r = 1.5 + Math.random() * 3;
                // رنگ سبز با اندکی تغییر در روشنایی و ته‌مایه
                // طیف سبز: از #00ff99 تا #66ffcc
                const brightness = 0.6 + Math.random() * 0.4;
                const green = Math.floor(200 + Math.random() * 55);
                const red = Math.floor(20 + Math.random() * 40);
                const blue = Math.floor(100 + Math.random() * 80);
                const color = `rgb(${red}, ${green}, ${blue})`;

                // ایجاد عنصر دایره
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', cx);
                circle.setAttribute('cy', cy);
                circle.setAttribute('r', r);
                circle.setAttribute('fill', color);
                circle.setAttribute('opacity', 0.7 + Math.random() * 0.3);
                // اضافه کردن سایه‌ی ملایم (در SVG با فیلتر میشه ولی برای سادگی از stroke استفاده نمیکنیم)

                // ذخیره داده‌ها برای انیمیشن
                stars.push({
                    element: circle,
                    x: cx,
                    y: cy,
                    radius: r,
                    speedX: (Math.random() - 0.5) * 0.6,   // سرعت افقی
                    speedY: (Math.random() - 0.5) * 0.6,   // سرعت عمودی
                    phase: Math.random() * 2 * Math.PI,    // برای حرکت موجی
                    baseX: cx,
                    baseY: cy,
                    amplitude: 0.8 + Math.random() * 2.5,   // دامنه نوسان
                });

                fragment.appendChild(circle);
            }

            svg.appendChild(fragment);

            // متغیرهای انیمیشن
            let frameId = null;
            let lastTimestamp = 0;

            // تابع انیمیشن (حرکت ملایم و موج‌دار)
            function animate(timestamp) {
                // محاسبه دلتا برای حرکت روان (حدود 60 فریم)
                const delta = Math.min((timestamp - lastTimestamp) / 16, 2); // نرمال‌سازی
                lastTimestamp = timestamp;

                // بروزرسانی موقعیت هر ستاره
                for (let s of stars) {
                    // حرکت با سرعت ثابت + نوسان سینوسی برای جلوه‌ی طبیعی
                    s.x += s.speedX * delta * 0.6;
                    s.y += s.speedY * delta * 0.6;

                    // افزودن حرکت موجی کوچک (برای چشمک‌زنی موقعیت)
                    const waveX = Math.sin(timestamp / 2000 + s.phase) * s.amplitude * 0.08;
                    const waveY = Math.cos(timestamp / 1800 + s.phase * 1.2) * s.amplitude * 0.08;

                    // اعمال به عنصر SVG
                    s.element.setAttribute('cx', s.x + waveX);
                    s.element.setAttribute('cy', s.y + waveY);

                    // بازگرداندن ستاره‌ها به طرف دیگر صفحه (برای حرکت بی‌نهایت)
                    if (s.x > W + 20) s.x = -20;
                    if (s.x < -20) s.x = W + 20;
                    if (s.y > H + 20) s.y = -20;
                    if (s.y < -20) s.y = H + 20;
                }

                // ادامه‌ی انیمیشن
                frameId = requestAnimationFrame(animate);
            }

            // شروع انیمیشن
            frameId = requestAnimationFrame(animate);

            // در صورت تغییر اندازه‌ی پنجره، viewBox و موقعیت‌ها رو به‌روزرسانی کن
            function handleResize() {
                const newW = window.innerWidth;
                const newH = window.innerHeight;

                svg.setAttribute('viewBox', `0 0 ${newW} ${newH}`);
                svg.setAttribute('width', newW);
                svg.setAttribute('height', newH);

                // برای هر ستاره، موقعیت را نسبی به اندازه‌ی جدید تنظیم کن
                // (برای سادگی، ستاره‌ها رو دوباره پخش می‌کنیم ولی بهتره که نسبی باشن)
                // ولی برای اینکه تجربه خوب باشه، موقعیت‌ها رو مقیاس می‌کنیم:
                const scaleX = newW / W;
                const scaleY = newH / H;

                for (let s of stars) {
                    s.x = s.x * scaleX;
                    s.y = s.y * scaleY;
                    s.baseX = s.baseX * scaleX;
                    s.baseY = s.baseY * scaleY;
                    s.element.setAttribute('cx', s.x);
                    s.element.setAttribute('cy', s.y);
                }

                // به‌روزرسانی متغیرهای عرض و ارتفاع
                // (این کار رو در ادامه انجام میدیم)
            }

            // برای اینکه resizing با دقت انجام بشه، متغیرهای W و H رو آپدیت می‌کنیم
            window.addEventListener('resize', () => {
                // برای سادگی، موقعیت‌ها رو دوباره محاسبه نمی‌کنیم و فقط viewBox رو تنظیم می‌کنیم
                // ولی برای اینکه ستاره‌ها از صفحه خارج نشوند، موقعیت‌ها رو محدود می‌کنیم
                const newW = window.innerWidth;
                const newH = window.innerHeight;
                svg.setAttribute('viewBox', `0 0 ${newW} ${newH}`);
                svg.setAttribute('width', newW);
                svg.setAttribute('height', newH);

                // محدود کردن ستاره‌ها به محدوده‌ی جدید (با مقیاس ساده)
                // اما برای اینکه کد سنگین نشه، فقط اونهایی که خارج شدن رو به داخل میاریم
                for (let s of stars) {
                    if (s.x > newW) s.x = newW - 10;
                    if (s.x < 0) s.x = 10;
                    if (s.y > newH) s.y = newH - 10;
                    if (s.y < 0) s.y = 10;
                    s.element.setAttribute('cx', s.x);
                    s.element.setAttribute('cy', s.y);
                }
            });

            // (اختیاری)停止 انیمیشن در صورت خروج از صفحه (بهینه‌سازی)
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    if (frameId) cancelAnimationFrame(frameId);
                } else {
                    if (!frameId) {
                        lastTimestamp = performance.now();
                        frameId = requestAnimationFrame(animate);
                    }
                }
            });

        })();
    </script>
</body>
</html>
